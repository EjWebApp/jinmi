# Render 배포 설정 (Blueprint). Render 대시보드 > New > Blueprint 에서 이 저장소를 고르면 됩니다.
services:
  - type: web
    name: jinmi
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node web.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: jinmi
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_ID
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
